<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通南巴承包商安全管理系统</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(1200px 700px at 50% -20%, rgba(29, 111, 184, .08), transparent 60%),
        radial-gradient(800px 500px at 80% 80%, rgba(45, 157, 110, .06), transparent 50%),
        linear-gradient(135deg, #0f1724 0%, #1a2639 50%, #0f1724 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e8edf2;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .top-accent {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent 0%, #1d6fb8 15%, #1d6fb8 85%, transparent 100%);
      opacity: .6;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 0 40px;
      text-align: center;
    }

    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1d6fb8 0%, #2d8ad0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(29, 111, 184, .35);
      margin-bottom: 20px;
    }

    .logo-text {
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,.15);
      user-select: none;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
    }

    .header .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,.5);
      margin-top: 6px;
      letter-spacing: 2px;
    }

    .header .org {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 20px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      font-size: 12px;
      color: rgba(255,255,255,.4);
      letter-spacing: 1px;
    }

    .tagline {
      text-align: center;
      margin-bottom: 44px;
    }
    .tagline p {
      font-size: 15px;
      color: rgba(255,255,255,.35);
      line-height: 1.7;
      max-width: 500px;
    }

    .entries {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 24px;
      width: 100%;
      margin-bottom: 48px;
    }

    .entry-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all .3s cubic-bezier(.4, 0, .2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .entry-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 16px 16px 0 0;
      transition: all .3s ease;
    }

    .entry-card:hover {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.15);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(0,0,0,.3);
    }

    .entry-card:active { transform: translateY(-1px); }

    .entry-card .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      transition: transform .3s ease;
    }

    .entry-card:hover .icon-wrap { transform: scale(1.08); }

    .entry-card .icon-wrap svg { width: 26px; height: 26px; }

    .entry-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .entry-card .desc {
      font-size: 13px;
      color: rgba(255,255,255,.4);
      line-height: 1.5;
    }

    .entry-card .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .5px;
    }

    .card-admin::before { background: linear-gradient(90deg, #1d6fb8, #4a90d9); }
    .card-admin .icon-wrap { background: linear-gradient(135deg, rgba(29,111,184,.25), rgba(29,111,184,.1)); }
    .card-admin .icon-wrap svg { color: #5ba0e0; }
    .card-admin .badge { background: rgba(29,111,184,.2); color: #5ba0e0; }
    .card-admin:hover { box-shadow: 0 16px 48px rgba(29,111,184,.12); }

    .card-safety::before { background: linear-gradient(90deg, #1d6fb8, #4a90d9); }
    .card-safety .icon-wrap { background: linear-gradient(135deg, rgba(29,111,184,.2), rgba(29,111,184,.08)); }
    .card-safety .icon-wrap svg { color: #5ba0e0; }
    .card-safety .badge { background: rgba(29,111,184,.18); color: #5ba0e0; }
    .card-safety:hover { box-shadow: 0 16px 48px rgba(29,111,184,.1); }

    .card-training::before { background: linear-gradient(90deg, #2d9d6e, #4cbf88); }
    .card-training .icon-wrap { background: linear-gradient(135deg, rgba(45,157,110,.2), rgba(45,157,110,.08)); }
    .card-training .icon-wrap svg { color: #4cbf88; }
    .card-training .badge { background: rgba(45,157,110,.18); color: #4cbf88; }
    .card-training:hover { box-shadow: 0 16px 48px rgba(45,157,110,.1); }

    .card-doc::before { background: linear-gradient(90deg, #e0851d, #f0a93c); }
    .card-doc .icon-wrap { background: linear-gradient(135deg, rgba(224,133,29,.2), rgba(224,133,29,.08)); }
    .card-doc .icon-wrap svg { color: #f0a93c; }
    .card-doc .badge { background: rgba(224,133,29,.18); color: #f0a93c; }
    .card-doc:hover { box-shadow: 0 16px 48px rgba(224,133,29,.1); }

    .footer {
      margin-top: auto;
      padding: 32px 0;
      text-align: center;
      width: 100%;
      border-top: 1px solid rgba(255,255,255,.04);
    }

    .footer p { font-size: 12px; color: rgba(255,255,255,.25); letter-spacing: .5px; }

    .footer .links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .footer .links a {
      color: rgba(255,255,255,.3);
      text-decoration: none;
      font-size: 12px;
      transition: color .2s ease;
    }

    .footer .links a:hover { color: rgba(255,255,255,.6); }

    @media (max-width: 768px) {
      .entries { grid-template-columns: 1fr; gap: 16px; }
      .header { padding-top: 40px; padding-bottom: 28px; }
      .header h1 { font-size: 20px; }
      .entry-card { padding: 28px 20px; }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .entries { grid-template-columns: repeat(2, 1fr); }
    }

    .container { opacity: 0; transform: translateY(20px); animation: fadeIn .7s ease forwards; }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

    .entry-card:nth-child(1) { animation: cardIn .5s ease .15s both; }
    .entry-card:nth-child(2) { animation: cardIn .5s ease .25s both; }
    .entry-card:nth-child(3) { animation: cardIn .5s ease .35s both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="top-accent"></div>
  <div class="container">

    <header class="header">
      <div class="logo-wrap">
        <span class="logo-text">通</span>
      </div>
      <h1>通南巴承包商安全管理系统</h1>
      <p class="subtitle">安全隐患整改 · 培训考核 · 一体化平台</p>
      <span class="org">通南巴项目部</span>
    </header>

    <div class="tagline">
      <p>选择入口，进入对应工作区</p>
    </div>

    <div class="entries">
      <a href="/admin/login" class="entry-card card-admin">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </div>
        <h3>管理后台</h3>
        <p class="desc">隐患录入及闭环管理、隐患设置、数据管理、培训管理、承包商管理</p>
        <span class="badge">管理员</span>
      </a>

      <a href="/safety/login" class="entry-card card-safety">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <h3>安全员入口</h3>
        <p class="desc">承包商安全员登录，自助录入与填报隐患、上传整改资料</p>
        <span class="badge">安全员</span>
      </a>

      <a href="/login" class="entry-card card-training">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <h3>培训考核</h3>
        <p class="desc">承包商人员参加安全培训考试、查看成绩与考核记录</p>
        <span class="badge">承包商人员</span>
      </a>

      <a href="/tnb/contractor-docs" class="entry-card card-doc">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>
          </svg>
        </div>
        <h3>开工资料上报</h3>
        <p class="desc">承包商按工程逐项上传开工资料（PDF/JPG），自动核验齐全度</p>
        <span class="badge">免登录上报</span>
      </a>
    </div>

    <footer class="footer">
      <p>© 2026 通南巴项目部 · 安全环保室</p>
      <div class="links">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">备案信息</a>
        <a href="/admin/login">管理后台</a>
        <a href="/safety/login">安全员</a>
        <a href="/tnb/contractor-docs">开工资料上报</a>
        <a href="/login">培训考核</a>
      </div>
    </footer>

  </div>
</body>
</html>
